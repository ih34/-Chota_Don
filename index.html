<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meesho Rozana prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3eaf0;--ink:#1f1f1f;--muted:#5c5c5c;--panel:#ffffff;--line:#e6e6e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1219;--ink:#f3f3f3;--muted:#c2b3bd;--panel:#2a1d26;--line:#3d2c38}}
:root[data-theme="dark"]{--bg:#1c1219;--ink:#f3f3f3;--muted:#c2b3bd;--panel:#2a1d26;--line:#3d2c38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mulish',sans-serif;display:flex;flex-direction:column;align-items:center}
a{color:#9f2089}a:hover{color:#580a46}
button,input,textarea,select{font-family:inherit}
.top,.journey,.hint{display:none}
.phone{width:100%;max-width:430px;height:calc(100% - 44px);background:#fff;color:#1f1f1f;overflow:hidden;position:relative;flex-shrink:0;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.demo{width:100%;max-width:430px;height:44px;box-sizing:border-box;display:flex;gap:6px;justify-content:center;align-items:center;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
.demo button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;height:30px;white-space:nowrap}
.demo button.danger{color:#c33;border-color:#e0a3a3}
}
.scr{flex-grow:1;display:flex;flex-direction:column;min-height:0;background:#fff;color:#1f1f1f;font-family:'Mulish',sans-serif}
.body{flex-grow:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:14px 16px;box-sizing:border-box}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #e6e6e6;flex-shrink:0}
.hdr .t{flex-grow:1;font-size:16px;font-weight:700}
.hdr .sub{font-size:11px;color:#5c5c5c}
.ib{width:40px;height:40px;border:1px solid #dedede;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;color:#1f1f1f}
.ib .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:#9f2089;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
.logo{width:40px;height:40px;border-radius:9px;object-fit:cover}
.tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid #cfcfcf;height:44px;box-sizing:border-box;font-size:14px;flex-shrink:0}
.tabs div{padding-bottom:10px;color:#5c5c5c}
.tabs .on{display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:3px solid #9f2089;font-weight:700;color:#1f1f1f;cursor:pointer}
.chip{font-size:10px;padding:2px 7px;border:1px solid #9f2089;border-radius:999px;color:#9f2089;background:#fce9f5;font-weight:600;white-space:nowrap}
.chipg{font-size:10px;padding:2px 7px;border:1px solid #8a8a8a;border-radius:999px;color:#3d3d3d;white-space:nowrap}
.chipy{font-size:10px;padding:2px 7px;border:1px solid #ff9d00;border-radius:999px;color:#7a4a00;background:#fff6e5;font-weight:600;white-space:nowrap}
.img{display:flex;align-items:center;justify-content:center;background:#ededed;border:1px dashed #8a8a8a;border-radius:6px;font-size:10px;color:#5c5c5c;flex-shrink:0;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:8px;background:#9f2089;color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;padding:0 16px;box-sizing:border-box;gap:8px}
.btn:disabled{background:#c9c9c9;cursor:not-allowed}
.btn.o{background:#fff;color:#9f2089;border:1px solid #9f2089}
.btn.s{height:40px;font-size:13px}
.card{border:1px solid #dedede;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.p{border-color:#9f2089}
.row{display:flex;align-items:center;gap:10px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid #cfcfcf;background:#fce9f5;flex-shrink:0}
.strip div{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 4px;font-size:11px;font-weight:600;text-align:center}
.strip div+div{border-left:1px solid #e3c9db}
.step{display:flex;align-items:center;border:1px solid #9f2089;border-radius:6px;overflow:hidden;height:34px;flex-shrink:0}
.step button{width:34px;height:34px;border:none;background:#fff;color:#9f2089;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step span{width:28px;text-align:center;font-size:13px;font-weight:700;background:#fce9f5;height:34px;display:flex;align-items:center;justify-content:center}
.add{height:34px;padding:0 12px;border:1px solid #9f2089;border-radius:6px;background:#fff;color:#9f2089;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.foot{padding:12px 16px 16px;border-top:1px solid #e6e6e6;display:flex;flex-direction:column;gap:8px;flex-shrink:0;background:#fff}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #e6e6e6;height:60px;flex-shrink:0;background:#fff}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#5c5c5c;background:none;border:none;cursor:pointer}
.nav button.on{color:#9f2089;font-weight:700}
.note{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed #ff9d00;background:#fff6e5;border-radius:8px;font-size:12px}
.note.g{border-color:#c9c9c9;background:#f6f6f6;color:#5c5c5c;border-style:dashed}
.pay{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid #cfcfcf;border-radius:8px;font-size:13px;box-sizing:border-box;cursor:pointer}
.pay.on{border-color:#9f2089;background:#fce9f5}
.tl{display:flex;gap:12px;min-height:46px}
.tl .d{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:14px;height:14px;border-radius:999px;background:#9f2089;flex-shrink:0}
.tl .dot.now{background:#fff;border:3px solid #9f2089;box-sizing:border-box}
.tl .dot.todo{background:#fff;border:2px solid #8a8a8a;box-sizing:border-box}
.tl .ln{flex-grow:1;width:2px;background:#9f2089}
.tl .ln.todo{background:#cfcfcf}
.toast{position:absolute;left:16px;right:16px;bottom:72px;background:#1f1f1f;color:#fff;font-size:12px;padding:10px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid #dedede;border-radius:8px;background:#fff}
.ok{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#e8f5ec;color:#1d7a3e;border-radius:8px;font-size:12px;font-weight:600}
.small{font-size:12px;color:#3d3d3d}
.h2{font-size:15px;font-weight:700}
.tick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #dedede;border-radius:8px;cursor:pointer}
.tick.on{border-color:#9f2089;background:#fdf6fb}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #9f2089;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;color:#fff}
.tick.on .cb{background:#9f2089}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #dedede;border-radius:8px;cursor:pointer}
.opt.on{border-color:#9f2089;background:#fdf6fb}
.rd{width:18px;height:18px;border-radius:999px;border:2px solid #9f2089;box-sizing:border-box;flex-shrink:0;background:#fff}
.opt.on .rd{background:#9f2089;box-shadow:inset 0 0 0 3px #fff}
.seg{display:flex;border:1px solid #9f2089;border-radius:8px;overflow:hidden}
.seg button{flex:1;height:36px;border:none;background:#fff;color:#9f2089;font-size:12px;font-weight:700;cursor:pointer}
.seg button.on{background:#9f2089;color:#fff}
.in{height:44px;border:1px solid #cfcfcf;border-radius:8px;padding:0 12px;font-size:14px;box-sizing:border-box;width:100%}
.ta{border:1px solid #cfcfcf;border-radius:8px;padding:10px 12px;font-size:13px;box-sizing:border-box;width:100%;min-height:120px;resize:vertical;line-height:1.5}
.photo{height:180px;border:2px dashed #9f2089;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9f2089;cursor:pointer;background:#fdf6fb;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sav{color:#1d7a3e;font-weight:700}
.mrp{color:#8a8a8a;text-decoration:line-through}
.sh{font-size:11px;color:#5c5c5c}
.bar{height:6px;background:#fce9f5;border-radius:999px;overflow:hidden}
.bar div{height:100%;background:#9f2089;width:0;transition:width 1.1s ease}

</style>
</head>
<body>
<div class="top"><h1>Meesho Rozana · customer walkthrough</h1><div id="visit" style="font-size:12px;color:var(--muted)"></div></div>
<div class="journey" id="journey"></div>
<div class="hint" id="hint"></div>
<div class="phone"><div class="scr" id="app"></div><div class="toast" id="toast"></div></div>
<div class="demo">
  <button data-demo="deliver">Demo: delivered</button>
  <button data-demo="days">Demo: +26 days</button>
  <button data-demo="reset" class="danger">Reset</button>
</div>

function items(){ return Object.keys(S.basket).filter(function(id){return S.basket[id].q>0;}).map(function(id){return {p:BY[id],q:S.basket[id].q,shop:shopOf(id),price:price(BY[id],shopOf(id))};}); }
function count(){ return items().reduce(function(a,x){return a+x.q;},0); }
function subtotal(){ return items().reduce(function(a,x){return a+x.price*x.q;},0); }
function savings(){ return items().reduce(function(a,x){return a+(x.p.mrp-x.price)*x.q;},0); }
function shopsInCart(){ var s={}; items().forEach(function(x){s[x.shop]=1;}); return Object.keys(s); }
function activeList(){ return S.lists.filter(function(l){return l.id===S.activeList;})[0] || S.lists[0] || null; }
function ticked(l){ return l? l.items.filter(function(i){return i.on;}) : []; }
function missingFromCart(){ var l=activeList(); return ticked(l).filter(function(i){return !(S.basket[i.id]&&S.basket[i.id].q>0);}); }
function addons(){
  var its=items(), out=[];
  var bath=its.filter(function(x){return x.p.cat==='bath';}).length, school=its.some(function(x){return x.p.cat==='school';});
  if(bath>=3 && !S.basket.org && !S.dismissed.org) out.push(BY.org);
  if(school && !S.basket.pcase && !S.dismissed.pcase) out.push(BY.pcase);
  return out.slice(0,2);
}
function nextRozanaDay(){ var t=new Date(now()); t.setHours(0,0,0,0); return t.getTime()+3*DAY; }
function cutoff(){ return now(); }
function lastOrder(){ return S.orders.length? S.orders[S.orders.length-1]:null; }
function status(o){
  if(o.delivered) return 4;
  var d=(now()-o.placedAt)/DAY;
  if(d>=3.2){ o.delivered=true; o.deliveredAt=o.rozanaDay+11*3600000; return 4; }
  if(d>=2.5) return 3; if(d>=1.2) return 2; if(d>=0.5) return 1; return 0;
}
function daysSince(o){ return Math.floor((now()-(o.deliveredAt||o.placedAt))/DAY); }
function due(){ var o=lastOrder(), l=activeList(); if(!o) return false; var c=(l&&l.cadence==='weekly')?5:23; return daysSince(o)>=c; }
function stage(){
  var o=lastOrder();
  if(!o) return S.lists.length? 1:0;
  if(status(o)<4) return 2;
  if(S.orders.length>=2) return 5;
  return due()? 4:3;
}
function matchLine(line){
  var need=null; LEXICON.forEach(function(x){ if(!need && x[0].test(line)) need=x[1]; });
  var qty=(line.match(/(\d+)\s*(notebook|copy|pen|sabun|soap)/i)||[])[1]; qty=qty?parseInt(qty,10):1;
  if(!need) return {line:line, qty:1, options:[], why:UNAVAIL_WHY.filter(function(w){return w[0].test(line);})[0][1]};
  var opts=CATALOG.filter(function(p){return p.need===need;}).sort(function(a,b){return price(a)-price(b);}).slice(0,3);
  return {line:line, qty:qty, need:need, options:opts.map(function(p){return p.id;})};
}

function render(){
  if(!app) return;
  app.innerHTML=(V[S.screen]||V.home)();
  var st=stage(), j=document.getElementById('journey'), h=document.getElementById('hint'), v=document.getElementById('visit');
  if(j) j.innerHTML=STAGES.map(function(s,i){return '<span class="'+(i<st?'done':(i===st?'now':''))+'">'+s+'</span>';}).join('');
  if(h) h.textContent=HINTS[S.screen]||'';
  if(v) v.textContent='Visit '+S.visits+(S.orders.length?' · '+S.orders.length+' order'+(S.orders.length===1?'':'s'):'');
  if(S.snap.stage==='reading'){ var bar=document.getElementById('readbar'); if(bar) setTimeout(function(){bar.style.width='100%';},50); }
  save();
}
function go(id){ S.screen=id; render(); var b=app&&app.querySelector('.body'); if(b) b.scrollTop=0; }
function bump(id,d){ var b=S.basket[id]||{q:0,shop:best(BY[id])[0]}; b.q=Math.max(0,b.q+d); if(b.q) S.basket[id]=b; else delete S.basket[id]; toast(d>0?'Added '+BY[id].name:'Removed '+BY[id].name); render(); }
function ensureList(name,cad){ var l=activeList(); if(l) return l; l={id:'L'+Date.now(),name:name||'My Rozana list',cadence:cad||'monthly',items:[]}; S.lists.push(l); S.activeList=l.id; return l; }
function addToList(l,id,q,on){ var e=l.items.filter(function(i){return i.id===id;})[0]; if(e){ e.on=on!==false; if(q) e.q=q; } else l.items.push({id:id,on:on!==false,q:q||1}); }
function useStarter(sid){ var s=STARTERS.filter(function(x){return x.id===sid;})[0]; var l={id:'L'+Date.now(),name:s.name,cadence:s.cadence,items:s.items.map(function(id){return {id:id,on:true,q:1};})}; S.lists.push(l); S.activeList=l.id; toast('List created'); go('list'); }
function reorder(){ var l=activeList(), o=lastOrder(); S.basket={}; if(l&&ticked(l).length) ticked(l).forEach(function(i){S.basket[i.id]={q:i.q||1,shop:best(BY[i.id])[0]};}); else if(o) o.items.forEach(function(x){S.basket[x.id]={q:x.q,shop:x.shop};}); go('checkout'); }

function bind(){
  app=document.getElementById('app'); toastEl=document.getElementById('toast');
  document.addEventListener('click',function(e){
    var t;
    if((t=e.target.closest('[data-demo]'))){
      var k=t.getAttribute('data-demo'), o=lastOrder();
      if(k==='reset'){ S=fresh(); S.visits=1; PHOTO=null; save(); go('home'); toast('Fresh start'); }
      if(k==='deliver'){ if(o&&!o.delivered){ o.delivered=true; o.deliveredAt=o.rozanaDay+11*3600000; S.offset=Math.max(S.offset||0,o.deliveredAt-Date.now()+3600000); go('orders'); toast('Delivered'); } else toast('No order in transit'); }
      if(k==='days'){ S.offset=(S.offset||0)+26*DAY; if(o&&!o.delivered){o.delivered=true;o.deliveredAt=o.rozanaDay+11*3600000;} go('home'); toast('26 days later'); }
      return;
    }
    if((t=e.target.closest('[data-inc]'))) return bump(t.getAttribute('data-inc'),1);
    if((t=e.target.closest('[data-dec]'))) return bump(t.getAttribute('data-dec'),-1);
    if((t=e.target.closest('[data-add]'))) return bump(t.getAttribute('data-add'),1);
    if((t=e.target.closest('[data-dismiss]'))){ S.dismissed[t.getAttribute('data-dismiss')]=1; return render(); }
    if((t=e.target.closest('[data-open]'))){ S.product=t.getAttribute('data-open'); return go('product'); }
    if((t=e.target.closest('[data-cat]'))){ S.cat=t.getAttribute('data-cat'); return go('shop'); }
    if((t=e.target.closest('[data-shop]'))){ var id=t.getAttribute('data-shop'); var b=S.basket[id]||{q:1}; b.shop=t.getAttribute('data-sid'); S.basket[id]=b; toast('Filled by '+SHOPS[b.shop].name); return render(); }
    if((t=e.target.closest('[data-pay]'))){ S.payment=t.getAttribute('data-pay'); return render(); }
    if((t=e.target.closest('[data-starter]'))) return useStarter(t.getAttribute('data-starter'));
    if((t=e.target.closest('[data-newlist]'))){ var l={id:'L'+Date.now(),name:'My Rozana list',cadence:'monthly',items:[]}; S.lists.push(l); S.activeList=l.id; return go('list'); }
    if((t=e.target.closest('[data-golist]'))){ S.activeList=t.getAttribute('data-golist'); return go('list'); }
    if((t=e.target.closest('[data-rmlist]'))){ var l2=activeList(); var rid=t.getAttribute('data-rmlist'); l2.items=l2.items.filter(function(i){return i.id!==rid;}); return render(); }
    if((t=e.target.closest('[data-tick]'))){ var l3=activeList(); var it=l3.items.filter(function(i){return i.id===t.getAttribute('data-tick');})[0]; it.on=!it.on; return render(); }
    if((t=e.target.closest('[data-tickall]'))){ var on=t.getAttribute('data-tickall')==='1'; activeList().items.forEach(function(i){i.on=on;}); return render(); }
    if((t=e.target.closest('[data-cad]'))){ activeList().cadence=t.getAttribute('data-cad'); return render(); }
    if((t=e.target.closest('[data-addlist]'))){ var l4=ensureList(); addToList(l4,t.getAttribute('data-addlist'),1,true); toast('Added to '+l4.name); return t.getAttribute('data-stay')?render():render(); }
    if((t=e.target.closest('[data-untick]'))){ var l5=activeList(); var it2=l5.items.filter(function(i){return i.id===t.getAttribute('data-untick');})[0]; if(it2) it2.on=false; return render(); }
    if((t=e.target.closest('[data-listtocart]'))){ ticked(activeList()).forEach(function(i){ var b2=S.basket[i.id]||{q:0,shop:best(BY[i.id])[0]}; b2.q=Math.max(b2.q,i.q||1); S.basket[i.id]=b2; }); toast('Ticked items added'); return go('checkout'); }
    if((t=e.target.closest('[data-sample]'))){ PHOTO=null; S.snap={stage:'reading',lines:[],picks:{}}; render(); setTimeout(function(){ S.snap.stage='lines'; S.snap.lines=SAMPLE_LINES.slice(); render(); },1400); return; }
    if((t=e.target.closest('[data-read]'))){ S.snap={stage:'reading',lines:[],picks:{}}; render(); setTimeout(function(){ S.snap.stage='lines'; S.snap.lines=SAMPLE_LINES.slice(); render(); },1400); return; }
    if((t=e.target.closest('[data-retake]'))){ PHOTO=null; S.snap={stage:'idle',lines:[],picks:{}}; return render(); }
    if((t=e.target.closest('[data-match]'))){ var ta=app.querySelector('[data-lines]'); S.snap.lines=ta.value.split('\n').map(function(x){return x.trim();}).filter(Boolean); S.snap.stage='results'; S.snap.picks={}; return render(); }
    if((t=e.target.closest('[data-pick]'))){ var line=S.snap.lines.map(matchLine).filter(function(r){return r.options.length;})[parseInt(t.getAttribute('data-pick'),10)].line; S.snap.picks[line]=t.getAttribute('data-sku'); return render(); }
    if((t=e.target.closest('[data-snapadd]'))){ var l6=ensureList('Snapped list'); var res=S.snap.lines.map(matchLine); res.forEach(function(r){ var id3=S.snap.picks[r.line]; if(!id3) return; addToList(l6,id3,r.qty,true); var b3=S.basket[id3]||{q:0,shop:best(BY[id3])[0]}; b3.q=Math.max(b3.q,r.qty); S.basket[id3]=b3; }); S.snap={stage:'idle',lines:[],picks:{}}; PHOTO=null; toast('Added to '+l6.name+' and cart'); return go('checkout'); }
    if((t=e.target.closest('[data-ret]'))){ S.returnPick[t.getAttribute('data-ret')]=t.checked; return render(); }
    if((t=e.target.closest('[data-return]'))){ var o2=lastOrder(), ids=Object.keys(S.returnPick).filter(function(k){return S.returnPick[k];}); o2.returned=ids; o2.returnedAt=now(); o2.refund=ids.reduce(function(a,id){var x=o2.items.filter(function(y){return y.id===id;})[0];return a+(x?x.price*x.q:0);},0); S.returnPick={}; render(); return toast('Return accepted. Rider collects on the next route.'); }
    if((t=e.target.closest('[data-reorder]'))) return reorder();
    if((t=e.target.closest('[data-place]'))){
      if(!count()) return;
      var its=items().map(function(x){return {id:x.p.id,q:x.q,shop:x.shop,price:x.price};});
      var ord={id:'RZ'+String(1000+S.orders.length+1), items:its, shops:shopsInCart(), subtotal:subtotal(), savings:savings(), total:subtotal(), payment:S.payment, placedAt:now(), rozanaDay:nextRozanaDay(), delivered:false};
      S.orders.push(ord); S.basket={}; S.returnPick={}; S.dismissed={};
      return go('confirmed');
    }
    if((t=e.target.closest('[data-go]'))){ e.preventDefault(); return go(t.getAttribute('data-go')); }
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches('[data-photo]') && t.files && t.files[0]){ var r=new FileReader(); r.onload=function(){ PHOTO=r.result; S.snap.stage='photo'; render(); }; r.readAsDataURL(t.files[0]); }
    if(t.matches('[data-rename]')){ activeList().name=t.value.trim()||'My Rozana list'; save(); }
  });
  render();
}
global.ROZANA={V:V, setState:function(s){S=s;}, getState:function(){return S;}, fresh:fresh, STARTERS:STARTERS, CATALOG:CATALOG, matchLine:matchLine, SAMPLE_LINES:SAMPLE_LINES, bind:bind, best:best};
if(global.document && document.getElementById && document.getElementById('app')) bind();
})(typeof window!=='undefined'?window:globalThis);

</script>
</body>
</html>
